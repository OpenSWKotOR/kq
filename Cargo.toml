[workspace]
resolver = "2"
members = ["crates/kq-format", "crates/kq-index", "crates/kq-cli"]

[workspace.package]
version = "0.4.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/arrenkaetris/kq"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
memmap2 = "0.9"
rayon = "1"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }

# Pinned to the branch that adds kotor-diff, because no tag carries that crate
# yet. Re-pin all three to a tag once arrenkaetris/kotor-formats#1 is merged and
# released — a branch moves, so this is not reproducible as it stands.
kotor-ncs-isa = { git = "https://github.com/arrenkaetris/kotor-formats", branch = "feat/kotor-diff" }
kotor-formats = { git = "https://github.com/arrenkaetris/kotor-formats", branch = "feat/kotor-diff" }
kotor-diff = { git = "https://github.com/arrenkaetris/kotor-formats", branch = "feat/kotor-diff", features = ["json"] }

# To work against a local kotor-formats checkout instead, uncomment:
# [patch."https://github.com/arrenkaetris/kotor-formats"]
# kotor-ncs-isa = { path = "../kotor-formats/crates/kotor-ncs-isa" }
# kotor-formats = { path = "../kotor-formats/crates/kotor-formats" }
# kotor-diff = { path = "../kotor-formats/crates/kotor-diff" }
