[workspace]
resolver = "2"
members = ["crates/kq-format", "crates/kq-index", "crates/kq-cli"]

[workspace.package]
version = "0.4.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/arrenkaetris/kq"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
memmap2 = "0.9"
rayon = "1"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }

# One tag for all three: cargo resolves a git source once, so every dependency
# taken from a repository has to name the same ref.
kotor-ncs-isa = { git = "https://github.com/arrenkaetris/kotor-formats", tag = "v0.3.0" }
kotor-formats = { git = "https://github.com/arrenkaetris/kotor-formats", tag = "v0.3.0" }
kotor-diff = { git = "https://github.com/arrenkaetris/kotor-formats", tag = "v0.3.0", features = ["json"] }

# To work against a local kotor-formats checkout instead, uncomment:
# [patch."https://github.com/arrenkaetris/kotor-formats"]
# kotor-ncs-isa = { path = "../kotor-formats/crates/kotor-ncs-isa" }
# kotor-formats = { path = "../kotor-formats/crates/kotor-formats" }
# kotor-diff = { path = "../kotor-formats/crates/kotor-diff" }
