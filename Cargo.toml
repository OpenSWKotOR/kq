[workspace]
resolver = "2"
members = ["crates/kq-format", "crates/kq-index", "crates/kq-cli"]

[workspace.package]
version = "0.3.5"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/arrenkaetris/kq"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
memmap2 = "0.9"
rayon = "1"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }

# Path deps while both trees sit side by side. Release builds pin a git tag:
# kotor-ncs-isa = { git = "https://github.com/oldrepublicwizard/kotor-formats", tag = "v0.1.0" }
# kotor-formats = { git = "https://github.com/oldrepublicwizard/kotor-formats", tag = "v0.1.0" }
kotor-ncs-isa = { version = "0.1.0", path = "../kotor-formats/crates/kotor-ncs-isa" }
kotor-formats = { version = "0.1.0", path = "../kotor-formats/crates/kotor-formats" }
